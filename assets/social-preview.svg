<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#rule)"/>

  <text x="88" y="150" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">agent-init</text>
  <text x="88" y="212" font-size="31" fill="#8b949e">Five coding agents, five config directories, one setup.</text>

  <!-- the shared tree -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">
    <text x="88" y="300" fill="#7ee787">.agents/</text>
    <text x="88" y="342" fill="#8b949e">├── skills/</text>
    <text x="88" y="384" fill="#8b949e">├── hooks/</text>
    <text x="88" y="426" fill="#8b949e">└── quality.toml</text>
  </g>

  <!-- what reads it -->
  <g font-size="26" fill="#c9d1d9">
    <text x="470" y="300">Claude Code</text>
    <text x="470" y="342">Codex</text>
    <text x="470" y="384">opencode</text>
    <text x="470" y="426">Mistral Vibe</text>
    <text x="470" y="468">Cursor</text>
  </g>
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M330 372 H 420"/>
    <path d="M420 372 V 292 H 452"/>
    <path d="M420 372 V 334 H 452"/>
    <path d="M420 372 H 452"/>
    <path d="M420 372 V 418 H 452"/>
    <path d="M420 372 V 460 H 452"/>
  </g>

  <rect x="88" y="512" width="470" height="62" rx="10" fill="#010409" stroke="#30363d"/>
  <text x="112" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> npx agent-init</text>

  <text x="1192" y="552" font-size="23" fill="#6e7681" text-anchor="end">One copy. Hooks that block. Nothing pretended.</text>
</svg>
