name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The whole emitted product is shell. This is the cheapest real-bug catcher we have.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s bash templates/agents/hooks/policies/*.sh templates/agents/hooks/adapters/*.sh
